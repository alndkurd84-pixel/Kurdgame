<!DOCTYPE html>
<html>
<head>
<title>Karo Host Auto-Exploit 9.00</title>
<meta charset="utf-8">
<style>
  body {
    background-color: #0f1015;
    color: #ffffff;
    font-family: Arial, sans-serif;
    text-align: center;
    margin: 0;
    padding-top: 15px;
  }
  h1 {
    font-size: 28px;
    color: #00ffd5;
    margin-bottom: 5px;
  }
  p {
    font-size: 16px;
    color: #ffae00;
    margin-bottom: 10px;
  }
  .image-container {
    margin: 0 auto;
  }
  img {
    width: auto;
    max-width: 90%;
    max-height: 55vh;
    height: auto;
    border-radius: 10px;
    box-shadow: 0 0 15px rgba(0,255,213,0.3);
    object-fit: contain;
  }
  #status-container {
    margin-top: 10px;
    font-size: 14px;
    color: #00ffd5;
  }
  .controls {
    margin-top: 15px;
  }
  button {
    background-color: #00ffd5;
    color: #0f1015;
    border: none;
    padding: 10px 25px;
    font-size: 16px;
    font-weight: bold;
    border-radius: 5px;
    cursor: pointer;
    box-shadow: 0 0 10px rgba(0,255,213,0.4);
    transition: 0.2s;
  }
  button:hover {
    background-color: #00cca3;
  }
  .checkbox-container {
    margin-top: 10px;
    font-size: 14px;
    color: #ffffff;
    cursor: pointer;
  }
  .checkbox-container input {
    transform: scale(1.2);
    margin-left: 5px;
    cursor: pointer;
  }
</style>
<script>
  function undefinedFunction() {}
  window.undefinedFunction = window.undefinedFunction || function() {};

  // دالة بدء العد التنازلي وتشغيل الثغرة بعد 5 ثوانٍ
  function startCountdown() {
    var controls = document.getElementById('controls-div');
    if (controls) controls.style.display = 'none';

    var pText = document.getElementById('status-text');
    var countdown = 5;

    pText.innerText = "Auto-running in " + countdown + " seconds...";

    var timer = setInterval(function() {
      countdown--;
      if (countdown > 0) {
        pText.innerText = "Auto-running in " + countdown + " seconds...";
      } else {
        clearInterval(timer);
        pText.innerText = "Jailbreaking... Please Wait (GoldHEN)";
        
        // تحميل ملف الثغرة الفعلي بعد انتهاء العداد
        var script = document.createElement('script');
        script.src = 'exploit.js';
        document.body.appendChild(script);
      }
    }, 1000);
  }

  window.onload = function () {
    var autoRun = localStorage.getItem('autoExploit');
    var checkbox = document.getElementById('autoCheck');

    if (autoRun === 'true') {
      if (checkbox) checkbox.checked = true;
      // إذا كان خيار التشغيل التلقائي مفعل، نبدأ العداد التنازلي فوراً
      startCountdown();
    }
  };

  function toggleAuto(element) {
    if (element.checked) {
      localStorage.setItem('autoExploit', 'true');
    } else {
      localStorage.setItem('autoExploit', 'false');
    }
  }

  // زر لإعادة التعيين إذا احتجت لإظهار الأزرار مجدداً
  function resetSettings() {
    localStorage.clear();
    location.reload();
  }
</script>
</head>
<body>
  <h1>Karo Host Auto-Exploit 9.00</h1>
  <p id="status-text">Choose how to run the exploit</p>
  
  <div class="image-container">
    <img src="IMG_1582.png" alt="Host Image">
  </div>

  <div id="controls-div" class="controls">
    <button onclick="startCountdown()">Run Exploit</button>
    <div class="checkbox-container">
      <label>
        <input type="checkbox" id="autoCheck" onclick="toggleAuto(this)"> Auto-Run next time
      </label>
    </div>
    <br>
    <button onclick="resetSettings()" style="background-color: #ff4444; font-size: 12px; padding: 5px 10px; margin-top: 10px;">Reset Settings</button>
  </div>

  <div id="status-container">
    <span id="progress"></span>
    <span id="mens"></span>
    <span id="all-set"></span>
  </div>
</body>
</html>
