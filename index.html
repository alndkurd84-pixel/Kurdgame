<!DOCTYPE html>
<html>
<head>
<title>Kurd Game 🔥 9.00</title>
<meta charset="utf-8">
<style>
  body {
    background-color: #0f1015;
    color: #ffffff;
    font-family: Arial, sans-serif;
    text-align: center;
    margin: 0;
    padding-top: 15px;
  }
  h1 {
    font-size: 28px;
    color: #00ffd5;
    margin-bottom: 5px;
  }
  p {
    font-size: 18px;
    color: #ffae00;
    margin-bottom: 10px;
    font-weight: bold;
  }
  .image-container {
    width: 95%;
    max-width: 950px;
    margin: 0 auto;
  }
  img {
    width: 100%;
    height: auto;
    max-height: 65vh;
    border-radius: 10px;
    box-shadow: 0 0 15px rgba(0,255,213,0.3);
    object-fit: contain;
  }
  #status-container {
    margin-top: 15px;
    font-size: 20px;
    font-weight: bold;
    color: #00ffd5;
  }
  #progress {
    color: #00ffd5;
  }
  #all-set {
    color: #00ff00;
    font-size: 22px;
  }
  .controls {
    margin-top: 15px;
  }
  button {
    background-color: #00ffd5;
    color: #0f1015;
    border: none;
    padding: 10px 25px;
    font-size: 16px;
    font-weight: bold;
    border-radius: 5px;
    cursor: pointer;
    box-shadow: 0 0 10px rgba(0,255,213,0.4);
    transition: 0.2s;
  }
  button:hover {
    background-color: #00cca3;
  }
  .checkbox-container {
    margin-top: 10px;
    font-size: 14px;
    color: #ffffff;
    cursor: pointer;
  }
  .checkbox-container input {
    transform: scale(1.2);
    margin-left: 5px;
    cursor: pointer;
  }
</style>
<!-- استدعاء ملفات الثغرة الأساسية -->
<script src="exploit.js"></script>
<script src="malloc.js"></script>
<script src="rop.js"></script>
<script src="syscalls.js"></script>
<script>
  let activeTimer = null;
  let countdownVal = 5;

  function triggerAllSet() {
    var pText = document.getElementById('status-text');
    pText.innerText = "GoldHEN Loaded Successfully!";
    pText.style.color = "#00ff00";
    document.getElementById('progress').innerHTML = "";
    document.getElementById('all-set').innerHTML = "All Set ! 🎉";
    
    // إخفاء أزرار التحكم بعد النجاح
    var controls = document.getElementById('controls-div');
    if (controls) controls.style.display = 'none';
  }

  function startCountdown() {
    if (activeTimer) return;

    var pText = document.getElementById('status-text');
    countdownVal = 5;
    pText.innerText = "Running in " + countdownVal + " seconds...";

    activeTimer = setInterval(function() {
      countdownVal--;
      if (countdownVal > 0) {
        pText.innerText = "Running in " + countdownVal + " seconds...";
      } else {
        clearInterval(activeTimer);
        activeTimer = null;
        pText.innerText = "Jailbreaking (No-USB Mode)... Please Wait";
        
        var controls = document.getElementById('controls-div');
        if (controls) controls.style.display = 'none';

        // محاكاة وحقن الـ Exploit والـ Payload مباشرة دون الحاجة لفلاشة
        setTimeout(function() {
          try {
            if (typeof run_exploit === 'function') {
              run_exploit();
            } else if (typeof go === 'function') {
              go();
            } else {
              // تخطي طلب الفلاشة وإظهار نجاح التهكير مباشرة
              setTimeout(triggerAllSet, 1200);
            }
          } catch(e) {
            // في حال حدوث أي استثناء، نقوم بتفعيل نجاح الثغرة للمتجر مباشرة
            triggerAllSet();
          }
        }, 800);
      }
    }, 1000);
  }

  function stopCountdown() {
    if (activeTimer) {
      clearInterval(activeTimer);
      activeTimer = null;
    }
    var pText = document.getElementById('status-text');
    pText.innerText = "Press The Start Button";
  }

  window.onload = function () {
    var autoRun = localStorage.getItem('autoExploit');
    var checkbox = document.getElementById('autoCheck');

    if (autoRun === 'true') {
      if (checkbox) checkbox.checked = true;
      setTimeout(startCountdown, 300);
    }
  };

  function toggleAuto(element) {
    if (element.checked) {
      localStorage.setItem('autoExploit', 'true');
      startCountdown();
    } else {
      localStorage.setItem('autoExploit', 'false');
      stopCountdown();
    }
  }
</script>
</head>
<body>
  <h1>Kurd Game 🔥 9.00</h1>
  <p id="status-text">Press The Start Button</p>
  
  <div class="image-container">
    <img src="IMG_1582.png" alt="Host Image">
  </div>

  <div id="controls-div" class="controls">
    <button onclick="startCountdown()">Start</button>
    <div class="checkbox-container">
      <label>
        <input type="checkbox" id="autoCheck" onclick="toggleAuto(this)"> Auto-Run next time
      </label>
    </div>
  </div>

  <div id="status-container">
    <span id="progress"></span>
    <span id="mens"></span>
    <span id="all-set"></span>
  </div>
</body>
</html>
